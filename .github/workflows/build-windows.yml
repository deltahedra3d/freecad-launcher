name: build-windows
on:
  push:
    tags: ["freecad-launcher-*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller PySide6 py7zr
      - run: pyinstaller freecad_smart_launcher_windows.spec --clean
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/*.exe
